    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>

<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 dark:bg-stone-950 flex items-center justify-between px-4 h-16 w-full tonal-shift no-border bg-transparent">
<h1 class="text-[#9B3F1E] dark:text-[#FFBDA7] font-['Public_Sans'] text-xl font-semibold tracking-tight text-center flex-1">口书</h1>
<div class="w-10 flex justify-end">

</div>
</header>
<main class="px-4 pt-4 space-y-6">
<!-- Simplified Header Section -->
<section class="px-1 py-4">
<h2 class="text-primary font-headline text-[32px] leading-tight font-bold">我的书稿</h2>
<p class="text-on-surface-variant font-body text-sm mt-1">回顾并继续您的创作旅程</p>
</section>
<!-- Drafts List -->
<section class="space-y-4">
<!-- Draft Item 1 -->
<div class="bg-surface-container rounded-lg p-4 space-y-4">
<div class="flex justify-between items-start">
<div class="space-y-1">
<h4 class="text-on-surface font-headline text-lg font-semibold">我的童年往事</h4>
<div class="flex items-center gap-2">
<span class="bg-secondary-container text-on-secondary-container px-3 py-0.5 rounded-full text-xs font-medium">正在创作</span>
<span class="text-on-surface-variant text-xs">更新于 2023-11-20</span>
</div>
</div>
</div>
<div class="flex gap-3">
<button class="flex-1 h-11 bg-primary text-on-primary rounded-full font-label font-semibold hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
                        继续编辑
                    </button>
<button class="px-4 h-11 bg-surface-container-highest text-primary rounded-full font-label font-semibold hover:bg-outline-variant/20 active:scale-95 transition-all">
                        预览
                    </button>
</div>
</div>
<!-- Draft Item 2 -->
<div class="bg-surface-container rounded-lg p-4 space-y-4">
<div class="flex justify-between items-start">
<div class="space-y-1">
<h4 class="text-on-surface font-headline text-lg font-semibold">外公的菜园札记</h4>
<div class="flex items-center gap-2">
<span class="bg-surface-container-highest text-on-surface-variant px-3 py-0.5 rounded-full text-xs font-medium">已完成</span>
<span class="text-on-surface-variant text-xs">更新于 2023-10-05</span>
</div>
</div>
</div>
<div class="flex gap-3">
<button class="flex-1 h-11 bg-secondary text-on-secondary rounded-full font-label font-semibold hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
                        查看作品
                    </button>
<button class="px-4 h-11 bg-surface-container-highest text-primary rounded-full font-label font-semibold hover:bg-outline-variant/20 active:scale-95 transition-all">

                    </button>
</div>
</div>
<!-- Draft Item 3 -->

<span class="bg-secondary-container text-on-secondary-container px-3 py-0.5 rounded-full text-xs font-medium">正在创作</span>
<span class="text-on-surface-variant text-xs">更新于 2023-11-15</span>
</div>
</div>
</div>
<div class="flex gap-3">
<button class="flex-1 h-11 bg-primary text-on-primary rounded-full font-label font-semibold hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
                        继续编辑
                    </button>
<button class="px-4 h-11 bg-surface-container-highest text-primary rounded-full font-label font-semibold hover:bg-outline-variant/20 active:scale-95 transition-all">
                        预览
                    </button>
</div>
</div>

<!-- Secondary Actions List -->
<section class="pt-4 space-y-1">
<button class="w-full flex items-center justify-between px-1 py-4 hover:bg-surface-container-low transition-colors rounded-lg group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary" data-icon="loyalty">loyalty</span>
<span class="text-on-surface font-body font-medium">会员权益</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between px-1 py-4 hover:bg-surface-container-low transition-colors rounded-lg group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary" data-icon="receipt_long">receipt_long</span>
<span class="text-on-surface font-body font-medium">订单记录</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between px-1 py-4 hover:bg-surface-container-low transition-colors rounded-lg group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary" data-icon="gavel">gavel</span>

</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>

<a class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 p-2 hover:bg-[#FDEAE4] transition-all active:scale-90" href="#">

<a class="flex flex-col items-center justify-center bg-[#FFBDA7] dark:bg-[#7A4A39] text-[#7A4A39] dark:text-[#FFBDA7] rounded-full px-5 py-1 active-pill active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="book_5" data-weight="fill" style="font-variation-settings: 'FILL' 1;">book_5</span>
<span class="font-['Public_Sans'] text-xs font-bold">我的书稿</span>
</a>
