<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>智能访谈 - Talkbook</title>
<!-- Google Fonts: Public Sans & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Public_Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error": "#ffffff",
                        "tertiary-container": "#00818b",
                        "primary-fixed": "#ffdbd0",
                        "on-surface-variant": "#56423c",
                        "inverse-surface": "#392e2a",
                        "tertiary-fixed-dim": "#73d5e0",
                        "surface-container": "#fdeae4",
                        "secondary-container": "#ffbda7",
                        "secondary-fixed-dim": "#f9b7a2",
                        "tertiary-fixed": "#90f2fc",
                        "outline-variant": "#ddc0b8",
                        "primary-container": "#bb5733",
                        "on-secondary-fixed": "#341105",
                        "on-primary": "#ffffff",
                        "surface-variant": "#f2ded9",
                        "on-primary-fixed": "#390c00",
                        "inverse-primary": "#ffb59c",
                        "surface-dim": "#e9d6d0",
                        "surface-bright": "#fff8f6",
                        "surface-container-low": "#fff1ed",
                        "on-background": "#231916",
                        "on-tertiary-container": "#f5feff",
                        "surface-tint": "#9e4220",
                        "outline": "#89726b",
                        "on-primary-fixed-variant": "#7f2b09",
                        "error-container": "#ffdad6",
                        "background": "#fff8f6",
                        "on-secondary-fixed-variant": "#683b2b",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004f55",
                        "surface-container-highest": "#f2ded9",
                        "secondary": "#845241",
                        "primary": "#9b3f1e",
                        "on-error-container": "#93000a",
                        "tertiary": "#00666e",
                        "on-surface": "#231916",
                        "on-secondary-container": "#7a4a39",
                        "surface": "#fff8f6",
                        "secondary-fixed": "#ffdbd0",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#ffb59c",
                        "on-tertiary-fixed": "#002023",
                        "on-primary-container": "#fffbff",
                        "surface-container-high": "#f8e4de",
                        "inverse-on-surface": "#ffede8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "1rem", "xl": "1.25rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Public Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-surface shadow-sm shadow-primary/5 h-16 px-4 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-100 ease-in-out">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-lg font-semibold tracking-tight text-on-surface">智能访谈</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 overflow-y-auto px-4 pt-6 pb-40 space-y-6">
<!-- AI Question Card (The Tactile Archive Style) -->
<section class="bg-surface-container-high p-6 rounded-lg shadow-sm border-l-4 border-primary">
<div class="flex items-center gap-3 mb-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="text-sm font-semibold text-primary uppercase tracking-wider">当前提问</span>
</div>
<p class="text-xl leading-relaxed font-semibold text-on-surface">
                那个时候的街道是什么样子的？您还记得最喜欢的那个小摊位吗？
            </p>
</section>
<!-- Segmented Button (M3 Style) -->
<div class="flex justify-center">
<div class="inline-flex rounded-full border border-outline p-1 gap-1">
<button class="flex items-center gap-2 px-6 py-2 rounded-full bg-secondary-container text-on-secondary-container transition-all">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
<span class="text-sm font-medium">语音播放</span>
</button>
<button class="flex items-center gap-2 px-6 py-2 rounded-full hover:bg-surface-container-low text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-[20px]">description</span>
<span class="text-sm font-medium">文字记录</span>
</button>
</div>
</div>
<!-- Conversation Timeline -->
<div class="space-y-6">
<!-- AI Message -->
<div class="flex flex-col items-start max-w-[85%]">
<span class="text-xs text-on-surface-variant mb-2 ml-1">上午 09:38</span>
<div class="bg-surface-container-low px-4 py-3 rounded-tr-lg rounded-br-lg rounded-bl-lg">
<p class="text-body-lg text-on-surface">刚才您提到了童年时住在老城区的经历，那里的邻里关系如何？</p>
</div>
</div>
<!-- User Message (Right Aligned) -->
<div class="flex flex-col items-end max-w-[85%] ml-auto">
<span class="text-xs text-on-surface-variant mb-2 mr-1">上午 09:40</span>
<div class="bg-primary-container text-on-primary-container px-4 py-3 rounded-tl-lg rounded-bl-lg rounded-br-lg">
<p class="text-body-lg">那时候大家都开着门，谁家做了好吃的全巷子都知道。我记得王奶奶家做的豆瓣酱最香了。</p>
</div>
</div>
<!-- AI Message -->
<div class="flex flex-col items-start max-w-[85%]">
<span class="text-xs text-on-surface-variant mb-2 ml-1">上午 09:41</span>
<div class="bg-surface-container-low px-4 py-3 rounded-tr-lg rounded-br-lg rounded-bl-lg">
<p class="text-body-lg">听起来充满了生活气息。那么，在那个时候的街道上，您最喜欢的角落是哪里？</p>
</div>
</div>
</div>
</main>
<!-- Recording Controls (Sticky Bottom) -->
<footer class="fixed bottom-0 left-0 right-0 bg-surface-container-high px-6 py-8 rounded-t-xl shadow-[0_-4px_12px_rgba(0,0,0,0.05)] border-t border-outline-variant/20">
<div class="max-w-md mx-auto space-y-6">
<!-- Buttons Section -->
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2 h-14 rounded-full border-2 border-primary text-primary font-semibold hover:bg-primary/5 transition-colors active:scale-95 duration-100 ease-in-out">
<span class="material-symbols-outlined">pause</span>
                    暂停录音
                </button>
<button class="flex-1 flex items-center justify-center gap-2 h-14 rounded-full bg-primary text-on-primary font-semibold shadow-md hover:shadow-lg transition-all active:scale-95 duration-100 ease-in-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stop</span>
                    结束录音
                </button>
</div>
<!-- Recording Status Info -->
<div class="text-center space-y-1">
<div class="flex items-center justify-center gap-2">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="text-on-surface-variant font-medium">正在录音</span>
</div>
<p class="text-lg font-bold tracking-widest text-on-surface">当前时长 01:25</p>
</div>
</div>
</footer>
</body></html>
